name: Verify & Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - 'engine/**'
      - 'config/**'
      - '.github/workflows/deploy-cloudflare.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'web/**'
      - 'engine/**'
      - 'config/**'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    name: Test Rust, Verify Wasm/TS Parity & Deploy
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Run Rust Engine Unit Tests
        run: cargo test --manifest-path engine/Cargo.toml

      - name: Compile Rust Engine to WebAssembly
        run: wasm-pack build engine --target web --out-dir ../web/src/wasm-pkg --release

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        working-directory: web
        run: npm ci

      - name: Bundle YAML Config, Lint, Verify Simulator & Cross-Engine Parity
        working-directory: web
        run: |
          node scripts/bundleConfig.cjs
          npm run lint
          bun scripts/verifySimulator.ts
          bun scripts/verifyParity.ts --require-wasm

      - name: Build Web Application
        working-directory: web
        run: npm run build

      - name: Deploy to Cloudflare Workers
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
