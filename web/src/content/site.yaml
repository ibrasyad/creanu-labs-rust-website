brand:
  name: "GroceryLab"
  domain: "sim.ibnulab.com"
  parentDomain: "ibnulab.com"
  footerLabel: "GroceryLab Synthetic Commerce Engine"
  zeroComputeLabel: "Zero Server Compute Cost"

nav:
  studio: "Config Studio"
  dashboard: "Analytics Dashboard"
  yaml: "Raw YAML"
  about: "About"

about:
  pipelineTitle: "How Each Simulated Day Works"
  pipelineSubtitle: "Deterministic per-date seeding ensures runs stay reproducible while reflecting realistic behavioral variance."
  pipelineSteps:
    - step: "01. Population & Growth"
      title: "Seeded Cohort Arrivals"
      detail: "Starts from persona base users and rolls daily new signups weighted by weekday, season, growth year, and marketing events."
    - step: "02. Visit & Decay"
      title: "Recency & Reactivation"
      detail: "Each user's visit likelihood scales by days since last activity, weekday schedule, and peak shopping hours."
    - step: "03. Funnel Journey"
      title: "5-Stage Conversion"
      detail: "Visitors progress from landing page to product view, add to cart, checkout, and paid—recording bounded stage durations."
    - step: "04. Basket & Cooldowns"
      title: "Grocery Affinity & Pricing"
      detail: "Paid orders draw items using category weights, repeat-purchase cooldown windows, duplicate rules, and IDR price noise."

  schemaTitle: "Output Dataset Explorer"
  schemaSubtitle: "Inspect the five relational CSV tables packaged in every ZIP download."
  schemaTables:
    users:
      filename: "user.csv"
      grain: "1 row per simulated customer"
      description: "Customer directory with customer persona, city, acquisition channel, and activity lifecycle dates."
      columns:
        - name: "user_id"
          type: "string"
          note: "Primary customer key (e.g. usr-000001)"
        - name: "persona"
          type: "string"
          note: "Customer persona (family_shoppers, students, etc.)"
        - name: "city"
          type: "string"
          note: "Weighted city distribution (Greater Jakarta)"
        - name: "gender"
          type: "string"
          note: "Persona-weighted demographic attribute"
        - name: "acquisition_channel"
          type: "string"
          note: "organic or paid channel"
        - name: "registered_date"
          type: "YYYY-MM-DD"
          note: "Initial cohort acquisition date"
        - name: "last_active_date"
          type: "YYYY-MM-DD"
          note: "Most recent landing_page visit date"
    funnel:
      filename: "funnel.csv"
      grain: "1 row per funnel stage event"
      description: "Timestamped customer journey log tracking drop-off and stage durations from visit to payment."
      columns:
        - name: "session_id"
          type: "string"
          note: "Unique session identifier"
        - name: "user_id"
          type: "string"
          note: "Foreign key to user.csv"
        - name: "persona"
          type: "string"
          note: "Customer persona for cohort slicing"
        - name: "activity"
          type: "enum"
          note: "landing_page, product_view, add_to_cart, checkout, paid"
        - name: "activity_datetime"
          type: "YYYY-MM-DD HH:MM:SS"
          note: "Timestamp computed via bounded stage duration"
    transactions:
      filename: "transaction.csv"
      grain: "1 row per completed order"
      description: "Order-level purchase headers linked to paid funnel sessions and summed basket totals."
      columns:
        - name: "trx_id"
          type: "string"
          note: "Order key derived from session (trx-<session_id>)"
        - name: "session_id"
          type: "string"
          note: "Foreign key to funnel.csv"
        - name: "user_id"
          type: "string"
          note: "Foreign key to user.csv"
        - name: "date"
          type: "YYYY-MM-DD HH:MM:SS"
          note: "Checkout payment completion timestamp"
        - name: "persona"
          type: "string"
          note: "Customer persona at purchase time"
        - name: "total_price"
          type: "number (IDR)"
          note: "Sum of line-item totals in Indonesian Rupiah"
    transaction_items:
      filename: "transaction_item.csv"
      grain: "1 row per product line item inside an order"
      description: "Detailed basket composition shaped by category affinity, subcategory cooldowns, and price noise."
      columns:
        - name: "trx_id"
          type: "string"
          note: "Foreign key to transaction.csv"
        - name: "user_id"
          type: "string"
          note: "Foreign key to user.csv"
        - name: "persona"
          type: "string"
          note: "Customer persona"
        - name: "date"
          type: "YYYY-MM-DD HH:MM:SS"
          note: "Order timestamp"
        - name: "product"
          type: "string"
          note: "Product SKU name matching catalog.csv"
        - name: "quantity"
          type: "integer"
          note: "Poisson-sampled units with category bias"
        - name: "unit_price"
          type: "number (IDR)"
          note: "Lognormal price variation around base_price"
        - name: "total_price"
          type: "number (IDR)"
          note: "quantity × unit_price"
    catalog:
      filename: "catalog.csv"
      grain: "1 row per grocery product"
      description: "Master product taxonomy covering fresh produce and supermarket essentials priced in IDR."
      columns:
        - name: "category"
          type: "string"
          note: "Top-level department (vegetables, fruits, dairy, etc.)"
        - name: "subcategory"
          type: "string"
          note: "Subcategory group governing cooldowns & duplicates"
        - name: "product"
          type: "string"
          note: "Unique product identifier"
        - name: "base_price"
          type: "number (IDR)"
          note: "Reference unit price in Indonesian Rupiah"

  glossaryTitle: "Interactive Simulation Lever Glossary"
  glossarySubtitle: "Select any YAML knob to inspect its exact simulation math and which exported tables it shifts."
  simulationLevers:
    - key: "visit_decay"
      label: "visit_decay"
      yamlPath: "simulation.visit_decay[]"
      summary: "Recency multiplier controlling how returning shoppers cool off or re-engage after their last visit."
      mechanism: "Each day, the engine computes days_since_last_visit = current_date - last_active_date and multiplies the weekday visit_chance by the matching threshold rule."
      outputImpact: "Drives realistic cohort retention curves and churn tail in funnel.csv and user.csv."
    - key: "cooldown"
      label: "cooldown"
      yamlPath: "catalog.<category>.<subcategory>.cooldown"
      summary: "Minimum restock gap (in days) before the same buyer buys from that subcategory again."
      mechanism: "Before picking basket items, the simulator checks the user's prior transaction_items timestamps and masks out subcategories still inside their cooldown window."
      outputImpact: "Prevents unrealistic back-to-back daily bulk restocks for staples like rice or cooking oil."
    - key: "base_lambda"
      label: "base_lambda"
      yamlPath: "personas.<persona>.quantity_model.base_lambda"
      summary: "Poisson intensity parameter governing how many units of each chosen product enter a basket."
      mechanism: "Multiplied by persona quantity_bias[category] and seasonal/event factors to draw Poisson unit counts (>= 1 per line item)."
      outputImpact: "Shapes quantity and total_price distributions in transaction_item.csv."
    - key: "subcategory_allow_duplicates"
      label: "subcategory_allow_duplicates"
      yamlPath: "simulation.subcategory_allow_duplicates / personas.<persona>.subcategory_allow_duplicates"
      summary: "Determines whether a single order can pick multiple distinct SKUs from the same subcategory."
      mechanism: "When false (default for single households), once apples are chosen, other fruit SKUs in that subcategory are excluded from the rest of that basket."
      outputImpact: "Controls basket breadth vs. category concentration in market-basket analysis."
    - key: "funnel_noise"
      label: "funnel_noise"
      yamlPath: "funnel.funnel_noise / personas.<persona>.funnel_noise"
      summary: "Daily stochastic variance applied on top of deterministic stage conversion rates."
      mechanism: "Applies bounded mean-one multiplicative noise (e.g., Poisson/lognormal dispersion) to step survival rolls so daily conversion fluctuates naturally."
      outputImpact: "Creates realistic day-to-day funnel conversion swings in funnel.csv."
    - key: "seed_for_date"
      label: "seed_for_date"
      yamlPath: "simulation.random_seed"
      summary: "Deterministic per-day seed derivation combining base random_seed and YYYY-MM-DD."
      mechanism: "Each simulated date derives an isolated deterministic stream, ensuring adding or extending horizon dates keeps earlier dates reproducible."
      outputImpact: "Guarantees baseline vs. scenario comparisons stay apples-to-apples over matched date windows."
    - key: "persona_visibility"
      label: "persona (Export Hidden)"
      yamlPath: "Export Settings -> Include config persona column"
      summary: "Internal persona label hidden in CSV downloads by default so clustering exercises stay honest."
      mechanism: "Algorithms like K-Means or GMM should infer customer segments from RFM spend, order frequency, and basket mix rather than leaking config persona names. Enable the toggle anytime for debugging."
      outputImpact: "Affects user.csv, funnel.csv, transaction.csv, and transaction_item.csv columns."
    - key: "global_fallbacks"
      label: "global fallbacks vs. persona overrides"
      yamlPath: "funnel.* / simulation.basket / simulation.quantity_model"
      summary: "Global funnel conversion rates, basket min/max bounds, weekday visit_chance, and base_lambda act strictly as fallbacks when a persona omits them."
      mechanism: "All six built-in customer personas define their own conversion_rate, basket, visit_chance, and quantity_model values, so editing those global defaults only affects newly created or custom personas that leave them unset."
      outputImpact: "To shift all existing personas simultaneously, use Global Behavior Multipliers (growth.base.overall), events, price_variation, or edit each persona directly."

  traceTitle: "Trace One Simulated Order"
  traceSubtitle: "Step through how a single seeded visitor turns into linked rows across funnel, transaction, and item tables."
  traceOrderSteps:
    - step: "01"
      title: "Daily Seed & Cohort Arrival"
      code: 'seed_for_date(20260101, "2026-02-14") -> usr-000142'
      detail: "Date seed initializes RNG. Buyer usr-000142 (registered 2026-01-12 under family_shoppers) enters the daily active eligibility pool."
    - step: "02"
      title: "Visit Chance × Recency Decay"
      code: "p_visit = saturday (0.20) × decay(6d = 1.0) -> landing_page @ 10:14:22"
      detail: "Saturday schedule and a 6-day recency window roll a store visit. Morning peak-hour weight places landing_page at 10:14:22."
    - step: "03"
      title: "5-Stage Funnel Durations"
      code: "landing_page -> product_view (+4m) -> add_to_cart (+2m) -> checkout (+5m) -> paid @ 10:25:51"
      detail: "Beta-bounded stage durations advance the session clock across five rows in funnel.csv with session_id = ses-20260214-0041."
    - step: "04"
      title: "Cooldown Filter & Basket Draw"
      code: "grains (cooldown 14d: skipped) | vegetables + dairy picked"
      detail: "Rice bought 5 days earlier is masked by cooldown. Weighted selection draws Tomatoes (×2) and Fresh Milk (×1) with lognormal price variation."
    - step: "05"
      title: "Relational Rows Emitted"
      code: "trx-ses-20260214-0041 -> IDR 58,400 across 2 items"
      detail: "One header row writes to transaction.csv, two line items write to transaction_item.csv, and usr-000142 last_active_date updates to 2026-02-14."
